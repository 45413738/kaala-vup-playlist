<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="阿茵點歌台 — 線上歌單查詢、曲風篩選與一鍵複製點歌指令" />
  <meta property="og:title" content="阿茵點歌台" />
  <meta property="og:description" content="阿茵的直播歌單！支援繁簡搜尋、曲風分類篩選與點擊一鍵複製點歌。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kaala-vup.org/" />
  <meta property="og:image" content="https://kaala-vup.org/avatar.jpg" />
  <title>阿茵點歌台</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <h1>阿茵點歌台</h1>

    <div class="layout">
      <!-- 左邊：歌單 -->
      <main class="left-panel">
        <div class="panel-header">
          <h2>歌單 <span id="song-count" class="song-count"></span></h2>
          <span class="click-hint">點擊歌曲卡片即可複製</span>
        </div>
        <div id="loading-message" class="empty-message">載入中...</div>
        <ul id="song-list" aria-live="polite"></ul>
        <div id="empty-message" class="empty-message" style="display:none;">
          找不到符合條件的歌曲
        </div>
      </main>

      <!-- 右邊：篩選（桌面版固定跟隨） -->
      <aside class="right-panel">
        <h2>篩選歌單</h2>

        <div class="tag-list" id="tag-list" role="group" aria-label="曲風分類篩選">
          <!-- 標籤將由 JS 動態生成 -->
        </div>

        <div class="search-box">
          <label for="search-input">搜尋歌曲（支援繁／簡體）：</label>
          <div class="search-input-wrapper">
            <input
              id="search-input"
              type="search"
              placeholder="輸入歌名、歌手或曲風..."
              autocomplete="off"
            />
            <button
              id="clear-search-btn"
              type="button"
              class="clear-search-btn"
              aria-label="清除搜尋內容"
              title="清除搜尋"
              style="display: none;"
            >
              &times;
            </button>
          </div>
        </div>

        <div class="copy-format-box">
          <label class="copy-format-label" for="prefix-toggle">
            <input type="checkbox" id="prefix-toggle" />
            <span>複製時加上「点歌 」前綴</span>
          </label>
          <div class="copy-format-preview" id="copy-format-preview">
            範例：歌名
          </div>
        </div>

        <div class="avatar-wrapper">
          <img
            src="avatar.jpg"
            class="avatar-img"
            alt="阿茵大頭貼"
            width="80"
            height="80"
            loading="lazy"
          />
        </div>
      </aside>
    </div>
  </div>

  <!-- 回到頂部按鈕 -->
  <button
    id="back-to-top"
    type="button"
    class="back-to-top"
    aria-label="回到頂部"
    title="回到頂部"
  >
    ↑
  </button>

  <!-- 複製提示 Toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
